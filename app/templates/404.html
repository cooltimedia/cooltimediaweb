{% extends "base.html" %}
{% load static wagtailcore_tags %}
{% block title %}
    404 - Page not found
{% endblock %}

{% block extra_css %}
<style>
    main{
        background-color: #0e0b14;
    }
    /* Animación personalizada para que el astronauta flote suavemente */
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
    }
    .animate-float {
        animation: float 6s ease-in-out infinite;
    }
</style>
{% endblock %}
{% block content %}
<main class="min-h-screen bg-black text-white flex items-center justify-center">
    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <div class="text-center md:text-left space-y-6 bg-black animate-fade-in-blur" data-delay="0.2">
            <h1 class="text-4xl md:text-8xl font-bold tracking-tighter uppercase">
                404-error
            </h1>
            <h2 class="text-4xl md:text-6xl font-bold text-gray-300 uppercase text-transparent bg-clip-text bg-gradient-to-r from-emerald-100 to-green-500">
                Page not found
            </h2>
            <p class="text-gray-400 text-lg font-medium max-w-md mx-auto md:mx-0">
                Sorry, the page you are looking for does not exist or has been moved.
            </p>
            <div class="pt-4">
                <a href="/" class="inline-block px-8 py-3 bg-white text-slate-900 font-bold rounded-full hover:bg-emerald-500 hover:text-white transition-all shadow-lg shadow-white/5duration-300">
                    Back To Home
                </a>
            </div>
        </div>

        <div class="flex justify-center md:justify-end animate-fade-in-blur" data-delay="0.2">
            <div class="absolute w-64 h-64 bg-purple-900/20 rounded-full blur-[100px] -z-10"></div>
            <img src="{% static 'images/404.png' %}" 
                 alt="404 Page not found" 
                 class="w-full max-w-sm md:max-w-md drop-shadow-[0_0_15px_rgba(255,255,255,0.1)] animate-[float_6s_ease-in-out_infinite]">
        </div>

    </div>
</main>
{% endblock %}
