{% extends "base.html" %}
{% load static wagtailcore_tags %}

{% block content %}
<main class="min-h-screen bg-slate-900 text-white overflow-hidden flex items-center justify-center px-6">
    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <div class="text-center md:text-left space-y-6">
            <h1 class="text-4xl md:text-8xl font-bold tracking-tighter uppercase">
                404-error
            </h1>
            <h2 class="text-2xl md:text-4xl font-bold text-gray-300 uppercase text-transparent bg-clip-text bg-gradient-to-r from-emerald-100 to-green-500">
                Page not found
            </h2>
            <p class="text-gray-400 text-lg max-w-md mx-auto md:mx-0">
                Your search has ventured beyond the known universe.
            </p>
            <div class="pt-4">
                <a href="/" class="inline-block px-8 py-3 bg-white text-slate-900 font-bold rounded-full hover:bg-emerald-500 hover:text-white transition-all shadow-lg shadow-white/5duration-300">
                    Back To Home
                </a>
            </div>
        </div>

        <div class="flex justify-center md:justify-end">
            <img src="{% static 'images/404.png' %}" 
                 alt="404 Page not found" 
                 class="w-full max-w-sm md:max-w-md animate-pulse">
        </div>

    </div>
</main>
{% endblock %}
