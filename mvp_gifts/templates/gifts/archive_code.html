<section class="px-5 pb-8">
    <div class="rounded-3xl bg-teal-50/60 border border-teal-100/50 px-5 py-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-[0.16em] text-teal-800">
            {% translate "Create your own" %}
        </p>

        <h2 class="mt-2 text-xl font-semibold tracking-tight text-slate-900">
            {% translate "Want your own gift profile?" %}
        </h2>

        <p class="mt-2 text-sm leading-relaxed text-slate-600">
            {% translate "Create a unique link with your preferences, ideas, and details so others can gift you better." %}
        </p>

        <a href="{% url 'gifts:dashboard' %}"
        class="mt-4 inline-flex w-full items-center justify-center rounded-2xl bg-teal-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-teal-800 active:scale-[0.98]">
            {% translate "Create my profile" %}
        </a>
    </div>
</section>
